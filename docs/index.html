  <script>
    const sites=[
      ['a','Boisko treningowe','ul. Macieja Rataja, Zabrze','1684/3, 1682/27','instalacja przy boisku treningowym','do 50 kWp',50.29503,18.79772,['A_01','A_02','A_03','A_04','A_05','A_06','A_07','A_08','A_09','A_10','A_11','A_12','A_13','A_14','A_15','A_16','A_17']],
      ['b','GKS Walka Makoszowy','ul. Jaskółcza 40, Zabrze','1215/60 (dach) lub 1222/61, 2395/61 (teren)','dwie instalacje: na dachu lub na terenie','2 × do 50 kWp',50.28635,18.78535,['B_01','B_02','B_03','B_04','B_05','B_06','B_07','B_08','B_09','B_10','B_11','B_12','B_13','B_14','B_15','B_16','B_17','B_18','B_19']],
      ['c','Powiatowy Urząd Pracy','pl. Krakowski 9, Zabrze','870/82','instalacja na budynku','do 50 kWp',50.30184,18.78814,['C_01','C_02','C_03','C_04','C_05','C_06','C_07','C_08','C_09','C_10','C_11']],
      ['d','Budynek wielorodzinny','ul. Legnicka 17, Zabrze','1846/86','instalacja na budynku','do 50 kWp',50.26736,18.76841,['D_01','D_02','D_03','D_04','D_05','D_06','D_07','D_08','D_09','D_10','D_11']],
      ['e','Hala Pogoń','ul. Wolności 406, Zabrze','4375/64','instalacja na budynku użyteczności publicznej','do 50 kWp',50.29644,18.80581,['E_01','E_02','E_03','E_04','E_05','E_06','E_07','E_08','E_09','E_10','E_11']],
      ['f','Dom Harcerza','ul. Wolności 350a, Zabrze','4815/2','instalacja na budynku użyteczności publicznej','do 50 kWp',50.30149,18.79572,['F_01','F_02','F_03','F_04','F_05','F_06','F_07','F_08','F_09']],
      ['g','Centrum Usług Społecznych','ul. Stalmacha 7, Zabrze','1034/78','instalacja na budynku użyteczności publicznej','do 50 kWp',50.30708,18.79028,['G_01','G_02','G_03','G_04','G_05','G_06','G_07','G_08','G_09','G_10','G_11','G_12','G_13','G_14','G_15']],
      ['h','Ogrzewalnia','ul. Stalmacha 7, Zabrze','1034/78','instalacja na budynku użyteczności publicznej','do 50 kWp',50.30696,18.79051,['H_01','H_02','H_03','H_04','H_05']],
      ['i','Punkt Obsługi Mieszkańców nr 1','ul. 3 Maja 84, Zabrze','875/35','instalacja na budynku wielorodzinnym','do 50 kWp',50.29114,18.79193,['I_01','I_02','I_03','I_04','I_05','I_06','I_07','I_08','I_09','I_10']],
      ['j','Budynek użyteczności publicznej','ul. Karola Miarki 5, Zabrze','1741/107','instalacja na budynku','do 50 kWp',50.30863,18.78460,['J_01','J_02','J_03','J_04','J_05','J_06','J_07','J_08']]
    ];
    const map=L.map('map',{zoomControl:false});L.control.zoom({position:'topright'}).addTo(map);
    const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
    const ortho=L.tileLayer.wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution',{layers:'Raster',format:'image/jpeg',version:'1.3.0',maxZoom:21,attribution:'Ortofotomapa &copy; GUGiK'});
    const esri=L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community'});
    map.createPane('cadastre');map.getPane('cadastre').style.zIndex='420';map.getPane('cadastre').style.pointerEvents='none';
    const cadastre=L.tileLayer.wms('https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaEwidencjiGruntow',{layers:'dzialki,numery_dzialek',format:'image/png',version:'1.1.1',transparent:true,maxZoom:21,pane:'cadastre',attribution:'Ewidencja gruntów &copy; GUGiK / KIEG'});
    const updateCadastre=()=>{if(map.getZoom()>=16){if(!map.hasLayer(cadastre))cadastre.addTo(map)}else if(map.hasLayer(cadastre))map.removeLayer(cadastre)};map.on('zoomend',updateCadastre);
    const markers={},bounds=[];let baseMap='map',parcelLayer=null;
    const $=id=>document.getElementById(id);const hide=id=>$(id).classList.add('hidden');const show=id=>$(id).classList.remove('hidden');
    function clearCards(){hide('hint');hide('details');hide('parcel')}

    // --- podglad bryly z otoczeniem i ortofoto, rysowany recznie na canvasie
    const LEKKI=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SLONCE=[0.42,-0.62,0.66];
    const AZ0=-Math.PI/2,EL0=0.72;          // start: polnoc do gory, jak na mapie
    const WYS_UWAGI={h:'8,80 m do dolnej krawędzi',j:'14 m',f:'9 m bez daszka'};
    const ORTO='https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution';
    const ESRI='https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export';
    function initModel(cv,m,lat,lon){
      const ctx=cv.getContext('2d'),V=[],SC=[];

      // Kazda bryla liczona osobno. Normalne kierujemy na zewnatrz wzgledem
      // srodka bryly, dzieki czemu mozna odrzucic sciany odwrocone tylem -
      // bryla jest wtedy pelna i nie widac jej wnetrza.
      const dodaj=(v,f,cel)=>{
        const off=V.length/3;
        for(const w of v)V.push(w);
        let cx=0,cy=0,cz=0;
        for(let i=0;i<v.length;i+=3){cx+=v[i];cy+=v[i+1];cz+=v[i+2]}
        const n3=v.length/3||1;cx/=n3;cy/=n3;cz/=n3;
        const norm=[];
        for(const t of f){
          if(t.length<3){norm.push(null);continue}
          const a=t[0]*3,b=t[1]*3,c=t[2]*3;
          const e1=[v[b]-v[a],v[b+1]-v[a+1],v[b+2]-v[a+2]];
          const e2=[v[c]-v[a],v[c+1]-v[a+1],v[c+2]-v[a+2]];
          let n=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
          const dl=Math.hypot(n[0],n[1],n[2])||1;
          norm.push([n[0]/dl,n[1]/dl,n[2]/dl]);
        }
        f.forEach((t,j)=>{
          const n=norm[j];
          if(!n)return;
          // W danych LOD2 sciany bywaja nawiniete raz tak, raz odwrotnie, wiec
          // strony zewnetrznej nie da sie wziac z kolejnosci wierzcholkow.
          // Ustalamy ja geometrycznie: normalna ma odchodzic od srodka bryly.
          let fx=0,fy=0,fz=0;
          for(const i of t){fx+=v[i*3];fy+=v[i*3+1];fz+=v[i*3+2]}
          fx=fx/t.length-cx;fy=fy/t.length-cy;fz=fz/t.length-cz;
          const nn=(n[0]*fx+n[1]*fy+n[2]*fz)<0?[-n[0],-n[1],-n[2]]:n;
          const jas=0.46+0.34*Math.max(0,nn[0]*SLONCE[0]+nn[1]*SLONCE[1]+nn[2]*SLONCE[2])
                       +0.20*Math.max(0,nn[2]);
          const dach=nn[2]>0.55;
          const baza=cel?(dach?[201,132,66]:[219,166,98]):(dach?[166,176,166]:[194,202,193]);
          SC.push({i:t.map(i=>i+off),d:0,n:nn,
                   c:'rgb('+baza.map(x=>Math.round(x*jas)).join(',')+')',
                   o:cel?'rgba(74,38,8,.34)':'rgba(16,40,28,.14)'});
        });
      };
      dodaj(m.v,m.f,true);
      const nCelu=V.length/3;
      for(const b of (m.o||[]))dodaj(b.v,b.f,false);

      // kadr ustawiony na bryle badanej, otoczenie moze wychodzic poza brzeg
      let lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];
      for(let j=0;j<nCelu;j++)for(let k=0;k<3;k++){const w=V[j*3+k];if(w<lo[k])lo[k]=w;if(w>hi[k])hi[k]=w}
      const c=[0,1,2].map(k=>(lo[k]+hi[k])/2);
      const promien=Math.max((Math.max(hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2])/2||1)*1.9,20);
      // Podloze klademy na najnizszym punkcie calej sceny, nie na zerze bryly
      // badanej. Sasiedzi stoja na wlasnych rzednych terenu i przy spadku
      // potrafia siegac ponizej - na plaskiej plaszczyznie wygladaliby jak
      // wkopani w ziemie.
      let zGrunt=0;
      for(let i=2;i<V.length;i+=3)if(V[i]<zGrunt)zGrunt=V[i];
      const N=V.length/3,PX=new Float32Array(N),PY=new Float32Array(N),PZ=new Float32Array(N);
      let az=AZ0,el=EL0,zoom=1,auto=!LEKKI,czeka=false;

      // ortofoto GUGiK jako podloze: kwadrat GR x GR metrow wokol budynku.
      // Mercator rozciaga metry o 1/cos(fi), stad przelicznik przy bboksie.
      // Podloze musi zakryc takze najdalszych sasiadow (do 100 m), inaczej
      // stoja poza zdjeciem albo tna sie o jego krawedz.
      let zasieg=promien*2.2;
      for(let j=0;j<N;j++){
        const dx=Math.abs(V[j*3]-c[0]),dy=Math.abs(V[j*3+1]-c[1]);
        if(dx>zasieg)zasieg=dx;
        if(dy>zasieg)zasieg=dy;
      }
      const GR=Math.round(zasieg*1.1),TEKS=512;
      let tlo=null;
      // srodek bryly z modelu jest dokladniejszy niz pinezka na mapie
      if(m.ll){lat=m.ll[0];lon=m.ll[1]}
      if(lat!=null){
        const R0=6378137,rad=Math.PI/180;
        const mx=lon*rad*R0,my=Math.log(Math.tan(Math.PI/4+lat*rad/2))*R0;
        const d=GR/Math.cos(lat*rad);
        const bbox=[mx-d,my-d,mx+d,my+d].map(v=>v.toFixed(2)).join(',');
        // Ortofoto GUGiK jest dokladniejsze i aktualniejsze dla Polski, ale ta
        // usluga bywa kapryszna - to samo zapytanie raz wraca 200, raz 404
        // (i zawsze 404, jesli nazwy parametrow napisac wielkimi literami).
        // Stad dwie proby, a potem zdjecia Esri, ktore odpowiadaja niezawodnie.
        const zrodla=[
          ORTO+'?service=WMS&request=GetMap&layers=Raster&styles='
            +'&format=image%2Fjpeg&transparent=false&version=1.3.0'
            +'&width='+TEKS+'&height='+TEKS+'&crs=EPSG%3A3857&bbox='+bbox,
          ESRI+'?bbox='+bbox+'&bboxSR=3857&imageSR=3857'
            +'&size='+TEKS+','+TEKS+'&format=jpg&f=image'
        ];
        let nr=0,powt=0;
        const wczytaj=()=>{
          if(nr>=zrodla.length)return;
          const img=new Image();
          img.onload=()=>{tlo=img;planuj(0)};
          img.onerror=()=>{
            tlo=null;
            if(nr===0&&powt<1){powt++}else{nr++;powt=0}
            setTimeout(wczytaj,500);
          };
          img.src=zrodla[nr];
        };
        wczytaj();
      }

      function planuj(ms){if(czeka)return;czeka=true;setTimeout(()=>requestAnimationFrame(rysuj),ms||0)}
      function rysuj(){
        czeka=false;
        if(!cv.isConnected)return;
        const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;
        if(!w||!h)return;
        if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}
        ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
        const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);
        const r0=-sa,r1=ca,u0=-ca*se,u1=-sa*se,u2=ce,f0=ca*ce,f1=sa*ce,f2=-se;
        const s=Math.min(w,h)/(promien*2.5)*zoom;

        if(tlo&&tlo.complete&&tlo.naturalWidth){
          const kr=2*GR/TEKS;                       // metry na piksel tekstury
          const aX=kr*r0*s,aY=-kr*u0*s;             // przyrost na +u (wschod)
          const bX=-kr*r1*s,bY=kr*u1*s;             // przyrost na +v (poludnie)
          const gx=-GR-c[0],gy=GR-c[1],gz=zGrunt-c[2];  // lewy gorny rog podloza
          ctx.save();
          ctx.transform(aX,aY,bX,bY,
            w/2+(gx*r0+gy*r1)*s, h/2-(gx*u0+gy*u1+gz*u2)*s);

          ctx.drawImage(tlo,0,0,TEKS,TEKS);
          ctx.globalAlpha=0.16;ctx.fillStyle='#f7f8f3';
          ctx.fillRect(0,0,TEKS,TEKS);
          ctx.restore();
        }

        for(let j=0;j<N;j++){
          const x=V[j*3]-c[0],y=V[j*3+1]-c[1],z=V[j*3+2]-c[2];
          PX[j]=w/2+(x*r0+y*r1)*s;PY[j]=h/2-(x*u0+y*u1+z*u2)*s;PZ[j]=x*f0+y*f1+z*f2;
        }
        // Zadnej sciany nie wyrzucamy - przy budynkach z wnekami test na strone
        // zewnetrzna potrafi sie pomylic, a wyciecie sciany robi dziure, przez
        // ktora widac wnetrze. Zamiast tego dwa przebiegi: najpierw sciany
        // odwrocone tylem, potem przednie. Dla bryly zamknietej kazda przednia
        // jest przed kazda tylna, wiec kolejnosc jest scisla, a pomylka w
        // normalnej najwyzej zle przydziela sciane do grupy - nie gubi jej.
        const tyl=[],przod=[];
        for(const sc of SC){
          let d=0;for(const i of sc.i)d+=PZ[i];
          sc.d=d/sc.i.length;
          (sc.n[0]*f0+sc.n[1]*f1+sc.n[2]*f2>=0?tyl:przod).push(sc);
        }
        tyl.sort((a,b)=>b.d-a.d);                   // malarz: od najdalszych
        przod.sort((a,b)=>b.d-a.d);
        ctx.lineWidth=0.6;
        for(const sc of tyl.concat(przod)){
          ctx.fillStyle=sc.c;ctx.strokeStyle=sc.o;
          ctx.beginPath();ctx.moveTo(PX[sc.i[0]],PY[sc.i[0]]);
          for(let k=1;k<sc.i.length;k++)ctx.lineTo(PX[sc.i[k]],PY[sc.i[k]]);
          ctx.closePath();ctx.fill();ctx.stroke();
        }

        // roza wiatrow - kierunek liczony tym samym rzutem co geometria
        const nx=r1,ny=-u1,nd=Math.hypot(nx,ny)||1,ox=24,oy=h-24,R=11;
        ctx.strokeStyle='rgba(16,40,28,.34)';ctx.lineWidth=1;ctx.fillStyle='#ffffffcc';
        ctx.beginPath();ctx.arc(ox,oy,R,0,6.284);ctx.fill();ctx.stroke();
        ctx.strokeStyle='#166534';ctx.lineWidth=2;ctx.beginPath();
        ctx.moveTo(ox-nx/nd*R*0.75,oy-ny/nd*R*0.75);
        ctx.lineTo(ox+nx/nd*R*0.8,oy+ny/nd*R*0.8);ctx.stroke();
        ctx.fillStyle='#166534';ctx.font='700 9px Inter,system-ui,sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('N',ox+nx/nd*(R+7),oy+ny/nd*(R+7));

        if(auto){az+=0.009;planuj(40)}
      }

      // obrot jednym palcem, przyblizanie dwoma albo kolkiem
      const akt=new Map();let ost=null,dyst0=0,zoom0=1;
      const skala=v=>Math.max(0.6,Math.min(6,v));
      cv.addEventListener('pointerdown',e=>{
        cv.setPointerCapture(e.pointerId);akt.set(e.pointerId,[e.clientX,e.clientY]);auto=false;
        if(akt.size===2){const p=[...akt.values()];
          dyst0=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);zoom0=zoom;ost=null}
        else ost=[e.clientX,e.clientY];
      });
      cv.addEventListener('pointermove',e=>{
        if(!akt.has(e.pointerId))return;
        akt.set(e.pointerId,[e.clientX,e.clientY]);
        if(akt.size>=2){
          const p=[...akt.values()],d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
          if(dyst0>0)zoom=skala(zoom0*d/dyst0);
          planuj(0);return;
        }
        if(!ost)return;
        az+=(e.clientX-ost[0])*0.011;
        // os pionowa zablokowana miedzy 20 a 89 stopni - nigdy od spodu.
        // Gorna granica przy pionie: wtedy dach kryje obrys i widac, czy bryla
        // stoi na wlasciwym budynku na ortofoto.
        el=Math.max(0.35,Math.min(1.553,el+(e.clientY-ost[1])*0.008));
        ost=[e.clientX,e.clientY];planuj(0);
      });
      const koniec=e=>{akt.delete(e.pointerId);dyst0=0;
        ost=akt.size===1?[...akt.values()][0]:null};
      cv.addEventListener('pointerup',koniec);
      cv.addEventListener('pointercancel',koniec);
      cv.addEventListener('wheel',e=>{e.preventDefault();auto=false;
        zoom=skala(zoom*Math.exp(-e.deltaY*0.0015));planuj(0)},{passive:false});
      cv.addEventListener('dblclick',()=>{az=AZ0;el=EL0;zoom=1;auto=false;planuj(0)});

      // pelny ekran: nakladka na cala strone, bez Fullscreen API - dziala tez na iOS
      const ramka=cv.parentElement,btn=ramka.querySelector('.vfull');
      const przelacz=wl=>{
        ramka.classList.toggle('pelny',wl);
        if(btn){btn.textContent=wl?'✕':'⛶';
          btn.setAttribute('aria-label',wl?'Zamknij pełny ekran':'Pełny ekran')}
        planuj(0);
      };
      if(btn)btn.onclick=()=>przelacz(!ramka.classList.contains('pelny'));
      document.addEventListener('keydown',e=>{
        if(e.key==='Escape'&&ramka.classList.contains('pelny'))przelacz(false)});
      new ResizeObserver(()=>planuj(0)).observe(cv);
      rysuj();
    }
    function showSite(s){clearCards();const model=(window.modele3d||{})[s[0]];const uw=WYS_UWAGI[s[0]];const zr=model&&model.zrodlo==='LOD1'?'LOD1 2024, prostopadłościan bez modelowanego dachu':'LOD2 2017';const viewer=model?`<div class="viewer"><canvas></canvas><b class="vh">${String(model.h).replace('.',',')} m</b><b class="vsrc">${model.zrodlo}</b><i class="vhint">obróć · przybliż</i><button class="vfull" type="button" aria-label="Pełny ekran">⛶</button></div><p class="vopis"><b>${String(model.h).replace('.',',')} m</b> — cała bryła, od terenu do najwyższego punktu (${zr}).${uw?` Pomiar w terenie: <b>${uw}</b>.`:''} Bryły są zamknięte — wnętrza nie widać. Szare to sąsiednia zabudowa istotna dla zacienienia. Podkład: ortofotomapa GUGiK / zdjęcia Esri.</p>`:'';const gallery=`<p class="photos-label">Zdjęcia z drona · ${s[8].length}</p><div class="photos ${s[8].length===1?'one':''}">${s[8].map((n,i)=>`<a href="obiekty/${n}.jpg" target="_blank" rel="noreferrer" aria-label="Otwórz zdjęcie ${i+1} obiektu ${s[0].toUpperCase()}"><img src="obiekty/${n}_t.jpg" alt="Zdjęcie z drona, obiekt ${s[0].toUpperCase()}, ujęcie ${i+1}" loading="lazy" decoding="async" width="520" height="293"></a>`).join('')}</div>`;$('details').innerHTML=`<button class="close" aria-label="Zamknij">×</button><div class="site-head"><span class="letter">${s[0]}</span><div><p>${s[2]}</p><h2>${s[1]}</h2></div></div>${viewer}${gallery}<div class="facts"><div><span>Zakres</span><b>${s[4]}</b></div><div><span>Moc</span><b>${s[5]}</b></div><div><span>Działka</span><b>${s[3]}</b></div></div><div class="detail-actions"><a class="route" target="_blank" rel="noreferrer" href="https://www.google.com/maps/dir/?api=1&destination=${s[6]},${s[7]}">↗ Trasa</a><a class="streetview" target="_blank" rel="noreferrer" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${s[6]},${s[7]}">◉ Street View</a></div>`;show('details');if(model)initModel($('details').querySelector('.viewer canvas'),model,s[6],s[7]);$('details').querySelector('.close').onclick=()=>{hide('details');show('hint')}}
    sites.forEach(s=>{const icon=L.divIcon({className:'',html:`<span class="pv-marker"><b>${s[0].toUpperCase()}</b></span>`,iconSize:[38,46],iconAnchor:[19,43]});const m=L.marker([s[6],s[7]],{icon,bubblingMouseEvents:false,title:`${s[0]}) ${s[1]}`}).addTo(map).on('click',()=>showSite(s));markers[s[0]]=m;bounds.push([s[6],s[7]])});map.fitBounds(bounds,{paddingTopLeft:[22,100],paddingBottomRight:[22,125],maxZoom:14});updateCadastre();
    $('list').innerHTML=sites.map(s=>`<button data-id="${s[0]}"><span class="letter">${s[0]}</span><span><strong>${s[1]}</strong><small>${s[2]}</small><em>${s[5]}</em></span></button>`).join('');$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=sites.find(x=>x[0]===b.dataset.id);hide('sheet');map.flyTo([s[6],s[7]],17);showSite(s)};
    $('open-list').onclick=$('hint').onclick=()=>show('sheet');$('close-list').onclick=()=>hide('sheet');
    $('all').onclick=()=>{map.fitBounds(bounds,{paddingTopLeft:[22,100],paddingBottomRight:[22,125],maxZoom:14});clearCards();show('hint')};
    $('layers').onclick=()=>{const layers={map:osm,ortho,esri},next=baseMap==='map'?'ortho':baseMap==='ortho'?'esri':'map';map.removeLayer(layers[baseMap]);layers[next].addTo(map);baseMap=next;$('layers').textContent=`▧ ${baseMap==='map'?'Ortofoto':baseMap==='ortho'?'Esri':'Mapa'}`;$('layers').setAttribute('aria-label',`Zmień podkład mapowy. Obecnie: ${baseMap==='map'?'mapa ulic':baseMap==='ortho'?'ortofotomapa GUGiK':'zdjęcia Esri'}`)};
    function status(t){$('status').textContent=t;t?show('status'):hide('status')}
    $('locate').onclick=()=>{status('Szukam…');navigator.geolocation.getCurrentPosition(p=>{L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:8,color:'#fff',weight:3,fillColor:'#166534',fillOpacity:1}).addTo(map).bindTooltip('Twoja lokalizacja').openTooltip();map.flyTo([p.coords.latitude,p.coords.longitude],15);status('')},()=>status('Nie udało się pobrać lokalizacji'),{enableHighAccuracy:true,timeout:10000})};
    map.on('click',async e=>{clearCards();status('Sprawdzam działkę…');const {lat,lng}=e.latlng;const u=`https://uldk.gugik.gov.pl/?request=GetParcelByXY&xy=${lng},${lat},4326&result=id,parcel,region,commune,county,voivodeship,datasource,geom_wkt&srid=4326`;try{const r=await fetch(u);if(!r.ok)throw 0;const l=(await r.text()).trim().split(/\r?\n/);if(l[0]!=='0'||!l[1])throw 0;const v=l.slice(1).join('\n').split('|'),w=v.slice(7).join('|'),p=[...w.matchAll(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)].map(m=>[+m[2],+m[1]]);if(parcelLayer)map.removeLayer(parcelLayer);if(p.length>2)parcelLayer=L.polygon(p,{color:'#facc15',weight:4,fillColor:'#facc15',fillOpacity:.18}).addTo(map);$('parcel').innerHTML=`<button class="close" aria-label="Zamknij">×</button><p class="eyebrow">Działka wskazana na mapie</p><h2>${v[1]}</h2><dl><div><dt>Identyfikator</dt><dd>${v[0]}</dd></div><div><dt>Obręb</dt><dd>${v[2]}</dd></div><div><dt>Gmina</dt><dd>${v[3]}</dd></div></dl><p class="source">Źródło: ULDK GUGiK · ${v[6]}</p>`;$('parcel').querySelector('.close').onclick=()=>{hide('parcel');if(parcelLayer)map.removeLayer(parcelLayer);show('hint')};status('');show('parcel')}catch{status('Nie udało się ustalić działki w tym miejscu')}});
