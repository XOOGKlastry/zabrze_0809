<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10281c">
  <title>Instalacje PV w Zabrzu — mapa</title>
  <meta name="description" content="Mobilna mapa planowanych instalacji fotowoltaicznych w Zabrzu.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin>
  <style>
    :root{--ink:#10281c;--green:#166534;--lime:#b8e34b;--paper:#f7f8f3;--line:#dce4db}*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{overflow:hidden;background:#dfe8df;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,a{font:inherit}.topbar{position:fixed;z-index:500;top:12px;left:12px;right:12px;min-height:68px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 11px;border:1px solid #10281c1f;border-radius:18px;background:#fffffff2;box-shadow:0 10px 32px #10281c24;backdrop-filter:blur(14px)}.brand{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--ink);color:var(--lime);font-size:23px}.eyebrow{margin:0 0 2px;color:#5f7266;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;font-size:17px;line-height:1.2}.icon{width:44px;height:44px;border:0;border-radius:13px;background:#eef2ec;font-size:20px;cursor:pointer}.actions{position:fixed;z-index:450;top:92px;left:12px;display:flex;gap:8px}.actions button{height:42px;display:flex;align-items:center;gap:7px;border:1px solid #10281c1f;border-radius:12px;padding:0 12px;background:#fffffff2;box-shadow:0 5px 18px #10281c1c;font-size:13px;font-weight:750;cursor:pointer}.status{position:fixed;z-index:650;top:142px;left:12px;padding:9px 12px;border-radius:10px;background:var(--ink);color:white;font-size:12px}.card{position:fixed;z-index:600;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:16px;border:1px solid #10281c1f;border-radius:21px;background:#fffffff8;box-shadow:0 14px 38px #10281c33}.close{position:absolute;top:10px;right:10px;width:38px;height:38px;border:0;border-radius:50%;background:#eef2ec;font-size:20px;cursor:pointer}.hint{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;cursor:pointer}.hint .symbol{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:#e7f3c7;font-size:21px}.hint strong,.hint small{display:block}.hint strong{font-size:14px}.hint small{margin-top:3px;color:#67776d;font-size:12px}.count,.letter{display:grid;place-items:center;font-weight:900}.count{width:35px;height:35px;border-radius:50%;background:var(--ink);color:white}.letter{width:34px;height:34px;border-radius:10px;background:var(--lime);text-transform:uppercase}.site-head{display:flex;gap:11px;padding-right:42px}.site-head p{margin:1px 0 3px;color:#607168;font-size:12px}.site-head h2{margin:0;font-size:17px}.facts{display:grid;grid-template-columns:1.4fr .7fr 1fr;gap:8px;margin:15px 0 13px}.facts div{padding:9px;border-radius:12px;background:#f0f4ee}.facts span,.facts b{display:block}.facts span,dt{color:#718078;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.facts b{margin-top:4px;font-size:12px;overflow-wrap:anywhere}.route{min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--ink);color:white;font-size:14px;font-weight:750;text-decoration:none}.parcel{border-top:4px solid #facc15}.parcel h2{margin:2px 44px 13px 0;font-size:23px}.parcel dl{display:grid;gap:7px;margin:0}.parcel dl div{display:grid;grid-template-columns:92px 1fr;gap:8px}.parcel dd{margin:0;font-size:12px;font-weight:700;overflow-wrap:anywhere}.source{margin:11px 0 0;padding-top:9px;border-top:1px solid var(--line);color:#718078;font-size:10px}.sheet{position:fixed;z-index:700;inset:86px 0 0;display:flex;flex-direction:column;border-radius:24px 24px 0 0;background:var(--paper);box-shadow:0 -12px 40px #10281c2e}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.sheet-head h2{margin:0;font-size:21px}.list{flex:1;overflow:auto;padding:8px 12px 24px}.list button{width:100%;display:grid;grid-template-columns:auto 1fr;gap:11px;padding:11px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}.list strong,.list small,.list em{display:block}.list strong{font-size:14px}.list small{margin:3px 0;color:#627268;font-size:12px}.list em{color:var(--green);font-size:12px;font-style:normal;font-weight:800}.note{margin:0;padding:10px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:white;color:#68786f;font-size:10px}.hidden{display:none!important}.pv-marker{width:38px;height:38px;display:grid;place-items:center;border:3px solid white;border-radius:13px 13px 13px 3px;background:var(--green);color:white;box-shadow:0 4px 13px #10281c4d;transform:rotate(-45deg)}.pv-marker b{font-size:13px;transform:rotate(45deg)}.leaflet-control-zoom{margin-top:92px!important;border:0!important}.leaflet-control-attribution{font-size:9px!important}
    @media(min-width:760px){.topbar{left:24px;right:auto;width:370px}.actions{left:24px}.card{left:24px;right:auto;width:390px}.sheet{inset:92px auto 18px 24px;width:390px;border-radius:22px}.leaflet-control-zoom{margin-top:14px!important}}
    @media(max-width:420px){.loc-label{display:none}.actions button{padding:0 11px}.facts{grid-template-columns:1fr 1fr}.facts div:first-child{grid-column:1/-1}}
  </style>
</head>
<body>
  <div id="map" aria-label="Mapa instalacji fotowoltaicznych"></div>
  <header class="topbar"><div class="brand" aria-hidden="true">☀</div><div><p class="eyebrow">Zabrze · 10 punktów</p><h1>Planowane instalacje PV</h1></div><button class="icon" id="open-list" aria-label="Otwórz listę">☰</button></header>
  <div class="actions"><button id="all">⌖ Wszystkie</button><button id="layers">▧ Ortofoto</button><button id="locate">◎ <span class="loc-label">Moja pozycja</span></button></div>
  <div class="status hidden" id="status" role="status"></div>
  <button class="card hint" id="hint"><span class="symbol">⌖</span><span><strong>Dotknij mapy, aby sprawdzić działkę</strong><small>Albo wybierz jeden z 10 punktów inwestycji</small></span><span class="count">10</span></button>
  <article class="card hidden" id="details"></article>
  <article class="card parcel hidden" id="parcel"></article>
  <section class="sheet hidden" id="sheet"><div class="sheet-head"><div><p class="eyebrow">11 instalacji · 10 pozycji</p><h2>Obiekty</h2></div><button class="icon" id="close-list" aria-label="Zamknij listę">×</button></div><div class="list" id="list"></div><p class="note">Mapa ulic: OpenStreetMap. Ortofotomapa i działki: GUGiK / Geoportal (ULDK). Punkt przy ul. Rataja jest orientacyjny.</p></section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin></script>
  <script>
    const sites=[
      ['a','Boisko treningowe','ul. Macieja Rataja, Zabrze','1684/3, 1682/27','instalacja przy boisku treningowym','do 50 kWp',50.29503,18.79772],
      ['b','GKS Walka Makoszowy','ul. Jaskółcza 40, Zabrze','1215/60 (dach) lub 1222/61, 2395/61 (teren)','dwie instalacje: na dachu lub na terenie','2 × do 50 kWp',50.28635,18.78535],
      ['c','Powiatowy Urząd Pracy','pl. Krakowski 9, Zabrze','870/82','instalacja na budynku','do 50 kWp',50.30184,18.78814],
      ['d','Budynek wielorodzinny','ul. Legnicka 17, Zabrze','1846/86','instalacja na budynku','do 50 kWp',50.26736,18.76841],
      ['e','Hala Pogoń','ul. Wolności 406, Zabrze','4375/64','instalacja na budynku użyteczności publicznej','do 50 kWp',50.29644,18.80581],
      ['f','Dom Harcerza','ul. Wolności 350a, Zabrze','4815/2','instalacja na budynku użyteczności publicznej','do 50 kWp',50.30149,18.79572],
      ['g','Centrum Usług Społecznych','ul. Stalmacha 7, Zabrze','1034/78','instalacja na budynku użyteczności publicznej','do 50 kWp',50.30708,18.79028],
      ['h','Ogrzewalnia','ul. Stalmacha 7, Zabrze','1034/78','instalacja na budynku użyteczności publicznej','do 50 kWp',50.30696,18.79051],
      ['i','Punkt Obsługi Mieszkańców nr 1','ul. 3 Maja 84, Zabrze','875/35','instalacja na budynku wielorodzinnym','do 50 kWp',50.29114,18.79193],
      ['j','Budynek użyteczności publicznej','ul. Karola Miarki 5, Zabrze','1741/107','instalacja na budynku','do 50 kWp',50.30863,18.78460]
    ];
    const map=L.map('map',{zoomControl:false});L.control.zoom({position:'topright'}).addTo(map);
    const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
    const ortho=L.tileLayer.wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution',{layers:'Raster',format:'image/jpeg',version:'1.3.0',maxZoom:21,attribution:'Ortofotomapa &copy; GUGiK'});
    map.createPane('cadastre');map.getPane('cadastre').style.zIndex='420';map.getPane('cadastre').style.pointerEvents='none';
    const cadastre=L.tileLayer.wms('https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaEwidencjiGruntow',{layers:'dzialki,numery_dzialek',format:'image/png',version:'1.1.1',transparent:true,maxZoom:21,pane:'cadastre',attribution:'Ewidencja gruntów &copy; GUGiK / KIEG'});
    const updateCadastre=()=>{if(map.getZoom()>=16){if(!map.hasLayer(cadastre))cadastre.addTo(map)}else if(map.hasLayer(cadastre))map.removeLayer(cadastre)};map.on('zoomend',updateCadastre);
    const markers={},bounds=[];let isOrtho=false,parcelLayer=null;
    const $=id=>document.getElementById(id);const hide=id=>$(id).classList.add('hidden');const show=id=>$(id).classList.remove('hidden');
    function clearCards(){hide('hint');hide('details');hide('parcel')}
    function showSite(s){clearCards();$('details').innerHTML=`<button class="close" aria-label="Zamknij">×</button><div class="site-head"><span class="letter">${s[0]}</span><div><p>${s[2]}</p><h2>${s[1]}</h2></div></div><div class="facts"><div><span>Zakres</span><b>${s[4]}</b></div><div><span>Moc</span><b>${s[5]}</b></div><div><span>Działka</span><b>${s[3]}</b></div></div><a class="route" target="_blank" rel="noreferrer" href="https://www.google.com/maps/dir/?api=1&destination=${s[6]},${s[7]}">↗ Wyznacz trasę</a>`;show('details');$('details').querySelector('.close').onclick=()=>{hide('details');show('hint')}}
    sites.forEach(s=>{const icon=L.divIcon({className:'',html:`<span class="pv-marker"><b>${s[0].toUpperCase()}</b></span>`,iconSize:[38,46],iconAnchor:[19,43]});const m=L.marker([s[6],s[7]],{icon,bubblingMouseEvents:false,title:`${s[0]}) ${s[1]}`}).addTo(map).on('click',()=>showSite(s));markers[s[0]]=m;bounds.push([s[6],s[7]])});map.fitBounds(bounds,{paddingTopLeft:[22,100],paddingBottomRight:[22,125],maxZoom:14});updateCadastre();
    $('list').innerHTML=sites.map(s=>`<button data-id="${s[0]}"><span class="letter">${s[0]}</span><span><strong>${s[1]}</strong><small>${s[2]}</small><em>${s[5]}</em></span></button>`).join('');$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=sites.find(x=>x[0]===b.dataset.id);hide('sheet');map.flyTo([s[6],s[7]],17);showSite(s)};
    $('open-list').onclick=$('hint').onclick=()=>show('sheet');$('close-list').onclick=()=>hide('sheet');
    $('all').onclick=()=>{map.fitBounds(bounds,{paddingTopLeft:[22,100],paddingBottomRight:[22,125],maxZoom:14});clearCards();show('hint')};
    $('layers').onclick=()=>{if(isOrtho){map.removeLayer(ortho);osm.addTo(map);$('layers').textContent='▧ Ortofoto'}else{map.removeLayer(osm);ortho.addTo(map);$('layers').textContent='▧ Mapa'}isOrtho=!isOrtho};
    function status(t){$('status').textContent=t;t?show('status'):hide('status')}
    $('locate').onclick=()=>{status('Szukam…');navigator.geolocation.getCurrentPosition(p=>{L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:8,color:'#fff',weight:3,fillColor:'#166534',fillOpacity:1}).addTo(map).bindTooltip('Twoja lokalizacja').openTooltip();map.flyTo([p.coords.latitude,p.coords.longitude],15);status('')},()=>status('Nie udało się pobrać lokalizacji'),{enableHighAccuracy:true,timeout:10000})};
    map.on('click',async e=>{clearCards();status('Sprawdzam działkę…');const {lat,lng}=e.latlng;const u=`https://uldk.gugik.gov.pl/?request=GetParcelByXY&xy=${lng},${lat},4326&result=id,parcel,region,commune,county,voivodeship,datasource,geom_wkt&srid=4326`;try{const r=await fetch(u);if(!r.ok)throw 0;const l=(await r.text()).trim().split(/\r?\n/);if(l[0]!=='0'||!l[1])throw 0;const v=l.slice(1).join('\n').split('|'),w=v.slice(7).join('|'),p=[...w.matchAll(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)].map(m=>[+m[2],+m[1]]);if(parcelLayer)map.removeLayer(parcelLayer);if(p.length>2)parcelLayer=L.polygon(p,{color:'#facc15',weight:4,fillColor:'#facc15',fillOpacity:.18}).addTo(map);$('parcel').innerHTML=`<button class="close" aria-label="Zamknij">×</button><p class="eyebrow">Działka wskazana na mapie</p><h2>${v[1]}</h2><dl><div><dt>Identyfikator</dt><dd>${v[0]}</dd></div><div><dt>Obręb</dt><dd>${v[2]}</dd></div><div><dt>Gmina</dt><dd>${v[3]}</dd></div></dl><p class="source">Źródło: ULDK GUGiK · ${v[6]}</p>`;$('parcel').querySelector('.close').onclick=()=>{hide('parcel');if(parcelLayer)map.removeLayer(parcelLayer);show('hint')};status('');show('parcel')}catch{status('Nie udało się ustalić działki w tym miejscu')}});
  </script>
</body>
</html>
